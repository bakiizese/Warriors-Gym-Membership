# Included in every location that sets its own add_header. nginx drops
# server-level add_header directives inside any location that declares one,
# so these cannot simply live at the server level.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# No X-Frame-Options here on purpose: the landing page embeds this app in a
# phone-frame iframe from another origin, which that header would block.
