server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container healthcheck; no need to touch the app.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Metro fingerprints these files, so they are safe to cache for a year.
    location ~ ^/(_expo|assets)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every route is pre-rendered (/AuthPage is AuthPage.html). Unknown paths fall
    # back to index.html so the app's own router shows its not-found screen.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
